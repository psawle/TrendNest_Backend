services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost --eval
          'try { if (rs.status().myState !== 1) quit(1); } catch (error) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}); quit(1); }'
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongodb_data:
